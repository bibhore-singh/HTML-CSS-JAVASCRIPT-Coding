<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <ol type="i" title="fruits name">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Grapes</li>
        <li>Papaya</li>
    </ol>
    <hr>
    <ul type="" title="Vegetables Name">
        <li>Tomato</li>
        <li>Potato</li>
        <li>Carrot</li>
        <li>Onion</li>
        <li>Ginger</li>
    </ul>
    <hr>
    <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>
    </dl>
   
</body>
</html>
