<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Margin</title>
    <style>
        div {
            border: 3px solid red;
        }

        .box1 {
            margin: 30px
        }

        .box2 {
            margin: top 20px;
            margin-right: 25px;
            margin-bottom: 20px;
            margin-left: 25px;
        }

        .box3 {width: 60%;
            margin: 20px auto
        }
    </style>
</head>

<body>
    <div class="box1">
        This is by using one value for margins.
    </div>
    <div class="box2">
        This is by using all four values for margins.
    </div>
    <div class="box3">
        This is by using only two values for margins.
    </div>
</body>

</html>
